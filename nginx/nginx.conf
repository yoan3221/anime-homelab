events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jellyfin: 自带 baseUrl=/jellyfin,不剥前缀
        location = /jellyfin  { proxy_pass http://jellyfin:8096; }
        location /jellyfin/   { proxy_pass http://jellyfin:8096; }

        # qBittorrent: 剥掉 /qb 前缀
        location = /qb { return 301 /qb/; }
        location /qb/ { proxy_pass http://qbittorrent:8080/; }

        # ani-rss: 剥掉 /ani 前缀
        location = /ani { return 301 /ani/; }
        location /ani/ { proxy_pass http://ani-rss:7789/; }

        # MCSManager: 剥掉 /mcsm 前缀
        location = /mcsm { return 301 /mcsm/; }
        location /mcsm/ { proxy_pass http://mcsmanager-web-1:23333/; }

        # glances: 剥掉 /glances 前缀 (glances 只綁 docker 網關)
        location = /glances { return 301 /glances/; }
        location /glances/ { proxy_pass http://172.22.0.1:61208/; }

        # LibreSpeed 網頁測速: 剥掉 /speedtest 前缀
        location = /speedtest { return 301 /speedtest/; }
        location /speedtest/ {
            proxy_pass http://librespeed:8080/;
            client_max_body_size 0;        # 上傳測試一次送 20MB blob，不限制
            proxy_request_buffering off;   # 上傳直接串流到後端，不落地
            proxy_buffering off;           # 下載不緩衝，測速才準
        }

        # Pixiv 背景图轮播
        location /bg/ {
            alias /etc/nginx/bg/;
            add_header Cache-Control "no-store";
            expires -1;
        }

        # IPTV 直播源播放清单 (Jellyfin Live TV)
        location /live/ {
            alias /etc/nginx/live/;
            add_header Cache-Control "no-store";
            types { application/vnd.apple.mpegurl m3u; }
        }

        # 面板增強腳本
        location /panel/ {
            alias /etc/nginx/panel/;
            add_header Cache-Control "no-store";
        }

# 总览面板 (不再整页刷新;背景图每次进入随机抽一张;网速/主机负载每15秒原地刷新)
        location / {
            proxy_pass http://glance:8080;
            sub_filter_once on;
            sub_filter '<head>' '<head>';
            sub_filter '</body>' '<script src="/panel/panel.js" defer></script></body>';
        }
    }
}